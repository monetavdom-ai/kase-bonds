function render(){
  const sum = parseFloat(document.getElementById('summa').value)||0;
  const risk = document.getElementById('risk').value;
  const maxDays = parseInt(document.getElementById('days').value);
  const q = document.getElementById('search').value.toLowerCase();
  let arr = DATA.filter(b=> (risk==='all'||b.risk===risk) && b.days<=maxDays && b.code.toLowerCase().includes(q));
  arr.sort((a,b)=> (sum*b.yld/100/12*(b.days/30.44)) - (sum*a.yld/100/12*(a.days/30.44)));
  document.getElementById('count').textContent = 'Показано: '+arr.length+' из '+DATA.length;
  document.getElementById('list').innerHTML = arr.map(b=>{
    const monthly = sum * b.yld/100/12;
    const total = monthly * (b.days/30.44);
    const cls = b.risk==='ОК'?'ok':(b.risk==='сред'?'sred':'risk');
    return `<div class="card"><b>${b.code}</b> <span class="${cls}">• ${b.risk}</span><br><span style="font-size:13px;color:#555">Цена ${b.price}% | Купон ${b.coupon}% | Доходность ${b.yld}% | Дней ${b.days}</span><br><b>${Math.round(monthly)} ₸ / мес</b> • всего ${Math.round(total)} ₸</div>`;

}
function refreshData(){
  document.getElementById('updated').textContent = 'обновляю...';
  fetch('/api/bonds').then(r=>r.json()).then(j=>{
    if(j.bonds && j.bonds.length>0) DATA = j.bonds;
    document.getElementById('updated').textContent = j.updated || 'нет данных';
    document.getElementById('status').textContent = j.status==='live' ? '✅ Настоящие цены с KASE' : '⏳ Показаны сохраненные цены, идет загрузка с KASE...';
    render();
  }).catch(()=>{
    document.getElementById('updated').textContent = 'сервер не найден, показаны сохраненные';
    render();
  });
}
