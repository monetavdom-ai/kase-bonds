<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Облигации KASE - живой калькулятор</title><style>body{font-family:system-ui,sans-serif;max-width:720px;margin:0 auto;padding:14px;background:#f6f6f6}h1{font-size:20px}.card{background:#fff;border-radius:12px;padding:14px;margin:10px 0}.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed #eee}.row:last-child{border:none}.muted{color:#666;font-size:13px}.big{font-size:22px;font-weight:800}.green{color:#0a7a42}.red{color:#c00}input,select{width:100%;padding:10px;font-size:16px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;margin:6px 0}button{padding:10px 14px;border:0;border-radius:8px;background:#111;color:#fff;font-size:15px;cursor:pointer}.bond{cursor:pointer}.bond.active{outline:2px solid #111}.warn{background:#fff3cd;border:1px solid #f0c36d;border-radius:8px;padding:10px;font-size:13px}.badge{font-size:12px;background:#e6f4ea;padding:3px 8px;border-radius:20px}</style></head><body>
<h1>Облигации KASE <span class="badge" id="status">загрузка...</span></h1>
<div class="muted" id="updated">Данные: —</div>
<div class="card"><label>Фильтр валюты</label><select id="curFilter"><option value="ALL">Все</option><option value="KZT" selected>Только тенге KZT</option><option value="USD">Только доллары USD</option></select><label>Сумма вложения</label><input id="amount" type="number" value="30000"><button onclick="loadBonds()">Обновить с KASE</button> <span class="muted">автообновление каждые 60 сек</span></div>
<div class="card"><h3 style="margin:0 0 8px">Список облигаций — нажми на облигацию</h3><div id="list"></div></div>
<div class="card"><h3 style="margin:0 0 8px">Калькулятор: <span id="selTicker">BTRKb22</span></h3><div id="calc"></div><div class="muted" style="margin-top:8px">Цена, купон и дни берутся из живой строки KASE. Поменялась цена на KASE — при обновлении списка пересчитается и чистый доход. Без учета комиссий, налогов и НКД.</div></div>
<script>
let bonds=[{ticker:'BTRKb22',currency:'KZT',price:107.6,coupon:17.5,days:1280,safe:true}];
let selected='BTRKb22';
function fmt(n){return n.toLocaleString('ru-RU',{maximumFractionDigits:2,minimumFractionDigits:2})+' тенге'}
function renderCalc(){
 let b=bonds.find(x=>x.ticker===selected)||bonds[0]; if(!b) return;
 document.getElementById('selTicker').textContent=b.ticker;
 let amt=+document.getElementById('amount').value||0;
 let nominal=b.price?amt/(b.price/100):0; let overpay=amt-nominal;
 let coupYear=nominal*(b.coupon/100); let coupMonth=coupYear/12; let years=b.days/365;
 let totalCoup=coupYear*years; let totalReturn=nominal+totalCoup; let net=totalReturn-amt;
 let curYield=b.price?b.coupon/(b.price/100):0; let ytm=years? (coupYear+(nominal-amt)/years)/amt*100:0;
 document.getElementById('calc').innerHTML='<div class=row><span>Цена KASE (живая)</span><b>'+b.price.toFixed(2)+'%</b></div><div class=row><span>Купон</span><b>'+b.coupon.toFixed(2)+'%</b></div><div class=row><span>Дней до погашения</span><b>'+b.days+' = '+years.toFixed(2)+' года</b></div><div class=row><span>Вкладываешь</span><b>'+fmt(amt)+'</b></div><div class=row><span>Покупаешь номинала</span><b>'+fmt(nominal)+'</b></div><div class=row><span>Переплата за цену</span><b class=red>-'+fmt(overpay)+'</b></div><div class=row><span>Купон в год</span><b>'+fmt(coupYear)+'</b></div><div class=row><span>Купон в месяц</span><b>'+fmt(coupMonth)+'</b></div><div class=row><span>Всего купонов за срок (валовый)</span><b>'+fmt(totalCoup)+'</b></div><div class=row><span>Всего вернется</span><b class=big>'+fmt(totalReturn)+'</b></div><div class=row><span>Чистый доход</span><b class="big green">'+fmt(net)+'</b></div><div class=row><span>Текущая доходность</span><b>'+curYield.toFixed(2)+'%</b></div><div class=row><span>Доходность к погашению (прибл.)</span><b>'+ytm.toFixed(2)+'%</b></div><div class=warn>Не путай: '+fmt(totalCoup)+' - только купоны. Чистый доход = купоны - переплата '+fmt(overpay)+'.</div>';
}
function renderList(){
 let f=document.getElementById('curFilter').value; let arr=bonds.filter(b=>f==='ALL'||b.currency===f);
 document.getElementById('list').innerHTML=arr.map(b=>'<div class="row bond '+(b.ticker===selected?'active':'')+'" onclick="selectBond(\''+b.ticker+'\')"><span><b>'+b.ticker+'</b> '+b.currency+' '+(b.safe?'✅ Безопасная':'')+'</span><span>'+b.price.toFixed(1)+'% | купон '+b.coupon.toFixed(1)+'% | '+b.days+' дн.</span></div>').join('')||'<div class=muted>Нет облигаций для фильтра</div>';
}
function selectBond(t){selected=t; renderList(); renderCalc();}
async function loadBonds(){
 document.getElementById('status').textContent='обновление...';
 try{
  let r=await fetch('/api/bonds'); if(!r.ok) throw new Error('no api');
  let data=await r.json();
  if(Array.isArray(data)&&data.length){ bonds=data; document.getElementById('status').textContent='живые данные KASE'; }
  else { document.getElementById('status').textContent='демо-данные (API пустой)'; }
 }catch(e){ document.getElementById('status').textContent='демо-данные (нет /api/bonds)'; }
 document.getElementById('updated').textContent='Обновлено: '+new Date().toLocaleString('ru-RU');
 renderList(); renderCalc();
}
document.getElementById('amount').addEventListener('input',renderCalc);
document.getElementById('curFilter').addEventListener('change',renderList);
loadBonds(); setInterval(loadBonds,60000);
</script></body></html>
